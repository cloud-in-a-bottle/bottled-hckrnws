server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://hn.algolia.com; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    # Upstream's manifest and shortcut icon refer to these legacy paths.
    location = /img/favicon.ico {
        try_files /favicon.ico =404;
        expires 1h;
    }

    location = /android-chrome-192x192.png {
        try_files /img/meta/android-chrome-192x192.png =404;
        expires 1h;
    }

    location = /android-chrome-512x512.png {
        try_files /img/meta/android-chrome-512x512.png =404;
        expires 1h;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|json|png|svg|webmanifest|webp|woff2?)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
